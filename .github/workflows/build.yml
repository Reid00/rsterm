name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and attach (e.g. v0.0.1); leave empty for Artifacts only"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag)) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  metadata:
    name: Validate version and toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select exact source ref
        id: source
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release.py select-source
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Validate package version and release tag
        id: version
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.expected_sha }}
          VERSION_TAG: ${{ steps.source.outputs.version_tag }}
        run: python scripts/release.py metadata --source source

  quality:
    name: macOS quality checks
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            source/target
          key: quality-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('source/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Run tests
        run: cargo test --locked
      - name: Deny Clippy warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test release packaging and attachment
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    name: Build ${{ matrix.target }}
    needs: metadata
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: rsterm
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: rsterm
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: rsterm.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: rsterm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: source
    env:
      RUST_TARGET: ${{ matrix.target }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
      BINARY_NAME: ${{ matrix.binary }}
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang cmake pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdbus-1-dev libegl1-mesa-dev libvulkan-dev
      - name: Locate Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem -Path $sdk -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\fxc.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using shader compiler: $fxc"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            source/target
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('source/Cargo.lock') }}
      - name: Compile all Windows and Linux targets
        if: runner.os != 'macOS'
        shell: bash
        run: cargo check --all-targets --locked --target "$RUST_TARGET"
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target "$RUST_TARGET"
      - name: Package release binary
        shell: bash
        run: |
          python ../scripts/package.py \
            --target "$RUST_TARGET" \
            --version "$PACKAGE_VERSION" \
            --binary "target/$RUST_TARGET/release/$BINARY_NAME" \
            --output-dir dist
      - name: Upload binary and checksum
        uses: actions/upload-artifact@v4
        with:
          name: rsterm-${{ matrix.target }}
          path: source/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Attach release binaries
    if: >-
      needs.metadata.outputs.release_tag != '' &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [metadata, quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: rsterm-*
          path: packages
          merge-multiple: true
      - name: Validate and attach missing binaries without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release.py attach --packages packages
