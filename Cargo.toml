[package]
name = "rsterm"
version = "0.0.1"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "fs", "macros", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
futures-util = "0.3"

# Native desktop UI and components
gpui-kit = "=0.7.3"

# SSH
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "=2.1.1"

# Terminal - using alacritty_terminal for mature VTE parsing
alacritty_terminal = "0.25"
portable-pty = "0.8"

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.10", features = ["v4"] }
bitflags = "2.6"
parking_lot = "0.12"
which = "6.0"
shellexpand = "3.1"
async-trait = "0.1"
chrono = "0.4"
crossbeam-channel = "0.5"

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android", target_os = "redox"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "=0.31.4", default-features = false, features = ["system", "network"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
mockall = "0.13"
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }