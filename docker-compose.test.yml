version: '3.8'
services:
  sftp:
    image: atmoz/sftp
    ports:
      - "2222:22"
    command: testuser:testpass:1001:1001:upload
    volumes:
      - sftp_test_data:/home/testuser/upload
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sftp_test_data: